[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unviz"
version = "0.1.0"
description = "Visualize and export McStas Union sample environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mapbox_earcut",
    "mcstasscript",
    "networkx",
    "numba",
    "numpy",
    "pygfx",
    "pylinalg",
    "qtpy",
    "rendercanvas",
    "shapely",
    "trimesh",
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Lomholt Christensen" },
]

[project.urls]
Homepage = "https://github.com/Lomholy/Union_visualizer"

[project.scripts]
unviz = "unviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
