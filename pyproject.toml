[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unviz"
version = "0.1.0"
description = "Visualize and export McStas Union sample environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numba"]
license = { file = "LICENSE" }
authors = [
    { name = "Daniel Lomholt Christensen" },
]

[project.scripts]
unviz = "cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "background",
    "bounding_box",
    "camera",
    "cli",
    "clipping",
    "coplanar",
    "gui_helpers",
    "logger_output",
    "mcstas_trace",
    "panels",
    "pipeline",
    "preprocess",
    "qt_helpers",
    "scene_objects",
    "union_clip",
    "union_facets",
    "union_viewer",
    "widgets",
]
