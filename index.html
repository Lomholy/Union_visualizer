<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Object Spawner</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px;
    }
    #objectUi {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;  /* stack vertically */
      align-items: stretch;    /* make them full width if needed */
      gap: 10px;                /* small vertical spacing */
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 8px;
    }
    #updateBtn,
    #editPanel label[for="editPriority"],
    #editPriority {
      display: block;
      width: 100%;
    }
    .file-input-label {
      /* reset button defaults (works in most browsers) */
      border:none;            /* remove default border */
      background:transparent; /* override any inherited bg */
      font-family:inherit;    /* keep page font */
      appearance:none;        /* remove native styling in Safari/Chrome */
      display: inline-block;
      padding: 6px 12px;
      background:#007bff;      /* blue */
      color:white;
      border-radius:4px;
      cursor:pointer;
    }
    .import-export-container {
      display: flex;
      flex-direction: column;   /* stack items vertically */
      align-items: center;      /* optional – centers them horizontally */
      gap: 12px;                 /* space between import & export controls */
    }

    .render-style-control {
      display: flex;          /* use flexbox */
      flex-direction: row;    /* horizontal alignment */
      align-items: center;    /* vertically center the items */
      margin-top: 10px;
    }

    /* Bigger font for both label and select */
    .render-style-control label,
    .render-style-control select {
      font-size: 1.1rem;      /* adjust as needed */
    }

    /* Space between the label and the dropdown */
    .render-style-control label {
      margin-right: 8px;
    }
    #shapeParams {
      margin-top: 1em; /* or 10-15px for a smaller gap */
    }

    #objectList li {
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    #objectList li:hover {
      background: #eee;
    }

    #objectList li.selected {
      background: #acbac9;
      color: white;
      font-weight: bold;
    }
    #slicePanel {
      position: absolute;
      bottom: 10px;        /* distance from bottom */
      right: 10px;         /* distance from right */
      width: 40%;     /* 1/6 of the viewport width */
      height: 50%;    /* 1/6 of the viewport height */
      background: rgba(255,255,255,0.95);
      padding: 12px;
      border-radius: 8px;
      font-family: sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      z-index: 100;
      overflow: auto;       /* allows scrolling if content exceeds panel */
    }
    #toggleSlicePanel {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 110;          /* above the panel */
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    #planeCanvas {
      width: 60%;
      height: 60%;
      border: 1px solid black; /* optional for visibility */
    }


  </style>
</head>
<body>
  <div id="ui">
  <div class="import-export-container">
    <label for="importFile" class="file-input-label">Import Union environment</label>
    <input type="file" id="importFile" accept=".instr" style="display:none;">

    <button id="downloadBtn" class="file-input-label">Export Union environment</button>
  

    <div class="render-style-control">
      <label for="renderStyle">Render Style:</label>
      <select id="renderStyle">
        <option value="transparent">Transparent</option>
        <option value="solid">Solid</option>
        <option value="wireframe">Wireframe</option>
        <option value="edges">Edges</option>
        <option value="normals">Normals</option>
      </select>
    </div>
    </div>
    <div id="objectListContainer" style="margin-top: 1em;">
      <h3>Current Objects</h3>
      <ul id="objectList"></ul>
    </div>
    <label>Shape:
      <select id="shape">
        <option>Box</option>
        <option>Sphere</option>
        <option>Cylinder</option>
        <option>Cone</option>
      </select>
    </label><br><br>
    <label>Priority:
      <input type="number" id="priority" value="1" />
    </label><br><br>
    <label>Material:
    <input type="text" id="material" value="vanadium" placeholder="Enter material name">
    </label><br><br>

    <button id="spawnBtn">Spawn Object</button><button id="deleteBtn">Delete Object</button>
    <div id="materialPanel">
      <h3>Materials</h3>
    <ul id="materialList"></ul>
  </div>
   </div>
    <div id="objectUi">
      <div id="editPanel" style="display:none; margin-top:1em;">
        <label>Object Name: <input type="text" id="objectName"></label><br>
        <label for="objectSelect">Select Object:</label>
        <select id="objectSelect">
          <option value="">-- Select an object --</option>
        </select>

        <h3>Edit Selected Object</h3>

        <label>Priority: <input type="number" id="editPriority"></label><br>
        <label>Material Name: <input type="text" id="materialName"></label><br>

        <div id="shapeParams"></div>
        <div>
          <label>X Position:</label>
          <input type="range" id="posXSlider" min="-0.5" max="0.5" step="0.01">
          <input type="number" id="posX" step="0.001"><br>
        
          <label>Y Position:</label>
          <input type="range" id="posYSlider" min="-0.5" max="0.5" step="0.01">
          <input type="number" id="posY" step="0.001"><br>
        
          <label>Z Position:</label>
          <input type="range" id="posZSlider" min="-0.5" max="0.5" step="0.01">
          <input type="number" id="posZ" step="0.001"><br>

          <label>X Rotation:</label>
          <input type="range" id="rotXSlider" min="-180" max="180" step="0.01">
          <input type="number" id="rotX" step="0.01"><br>
        
          <label>Y Rotation:</label>
          <input type="range" id="rotYSlider" min="-180" max="180" step="0.01">
          <input type="number" id="rotY" step="0.01"><br>
        
          <label>Z Rotation:</label>
          <input type="range" id="rotZSlider" min="-180" max="180" step="0.01">
          <input type="number" id="rotZ" step="0.01"><br>
        </div>
      
      
      
      
      </div>
  </div>
  <!-- Slice Panel -->
<div id="slicePanel" style="display:none;">
  <h3>Slice Panel</h3>
  <div style="display:flex; align-items:flex-start; gap:1rem;">
    <!-- Canvas on the left -->
    <canvas id="planeCanvas" width="300" height="300" style="border:1px solid #aaa;"></canvas>
    
    <!-- Controls on the right -->
    <div>
      <label for="planeHeight">XY Plane Height (Y):</label><br>
      <input type="range" id="planeHeight" min="-2" max="2" step="0.001" value="0"><br><br>

      <label>
        Width:<br>
        <input id="planeWidth" type="range" min="0.1" max="10" step="0.1" value="2">
      </label><br><br>

      <label>
        Length:<br>
        <input id="planeHeightSize" type="range" min="0.1" max="10" step="0.1" value="2">
      </label>
    </div>
  </div>
</div>

<!-- toggle slice panel button -->
<button id="toggleSlicePanel">Toggle Slice panel</button>


  
  <script type="module" src="main.js"></script>
</body>
</html>
