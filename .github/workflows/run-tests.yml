name: Unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: unviz_env.yml
          environment-name: unviz
          cache-environment: true
          init-shell: bash


      - name: Install unviz from this checkout
        shell: bash -l {0}
        run: python -m pip install -e . --no-deps


      - name: Verify environment
        shell: bash -l {0}
        run: |
          micromamba info
          which python
          python --version
          micromamba list
          which unviz
          unviz --help


      - name: Run unit tests
        shell: bash -l {0}
        run: |
          python -m unittest discover -s tests/tests_unit -v
