<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Object Spawner</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <input type="file" id="importFile" accept=".instr">
    <button id="importBtn">Import Scene</button>
    <label for="renderStyle" style="display:block; margin-top:10px;">Render Style:</label>
    <select id="renderStyle">
      <option value="transparent">Transparent</option>
      <option value="solid">Solid</option>
      <option value="wireframe">Wireframe</option>
      <option value="edges">Edges</option>
      <option value="normals">Normals</option>
    </select>
    <div id="objectListContainer" style="margin-top: 1em;">
      <h3>Current Objects</h3>
      <ul id="objectList"></ul>
    </div>
    <label>Shape:
      <select id="shape">
        <option>Box</option>
        <option>Sphere</option>
        <option>Cylinder</option>
        <option>Cone</option>
      </select>
    </label><br><br>
    <label>Priority:
      <input type="number" id="priority" value="1" />
    </label><br><br>
    <label>Material:
      <select id="material">
        <option value="#ff0000">Red</option>
        <option value="#00ff00">Green</option>
        <option value="#0000ff">Blue</option>
      </select>
    </label><br><br>
    <button id="spawnBtn">Spawn Object</button><button id="deleteBtn">Delete Object</button>
    
    <div id="editPanel" style="display:none; margin-top:1em;">
      <label>Object Name: <input type="text" id="objectName"></label><br>
      <label for="objectSelect">Select Object:</label>
      <select id="objectSelect">
        <option value="">-- Select an object --</option>
      </select>

      <h3>Edit Selected Object</h3>
      <div>
        
        <label>X Position:</label>
        <input type="range" id="posXSlider" min="-10" max="10" step="0.01">
        <input type="number" id="posX" step="0.01"><br>
      
        <label>Y Position:</label>
        <input type="range" id="posYSlider" min="-10" max="10" step="0.01">
        <input type="number" id="posY" step="0.01"><br>
      
        <label>Z Position:</label>
        <input type="range" id="posZSlider" min="-10" max="10" step="0.01">
        <input type="number" id="posZ" step="0.01"><br>

        <label>X Rotation:</label>
        <input type="range" id="rotXSlider" min="-10" max="10" step="0.01">
        <input type="number" id="rotX" step="0.01"><br>
      
        <label>Y Rotation:</label>
        <input type="range" id="rotYSlider" min="-10" max="10" step="0.01">
        <input type="number" id="rotY" step="0.01"><br>
      
        <label>Z Rotation:</label>
        <input type="range" id="rotZSlider" min="-10" max="10" step="0.01">
        <input type="number" id="rotZ" step="0.01"><br>
      </div>
      <div id="shapeParams"></div>
      <label>Priority: <input type="number" id="editPriority"></label><br>
      <label>Material Name: <input type="text" id="materialName"></label><br>
      <button id="updateBtn">Update Object</button>
      
    </div>
    <button id="downloadBtn">Download File</button>

    
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
